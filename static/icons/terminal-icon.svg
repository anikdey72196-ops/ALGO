<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Candlestick chart watermark accents in background -->
  <g opacity="0.18">
    <!-- Candle 1 (Bullish) -->
    <line x1="120" y1="180" x2="120" y2="340" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="106" y="220" width="28" height="80" rx="4" fill="#10b981"/>
    
    <!-- Candle 2 (Bearish) -->
    <line x1="190" y1="150" x2="190" y2="310" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <rect x="176" y="180" width="28" height="90" rx="4" fill="#f43f5e"/>

    <!-- Candle 3 (Bullish) -->
    <line x1="260" y1="130" x2="260" y2="290" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="246" y="150" width="28" height="100" rx="4" fill="#10b981"/>

    <!-- Candle 4 (Bullish breakout) -->
    <line x1="330" y1="100" x2="330" y2="260" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <rect x="316" y="120" width="28" height="110" rx="4" fill="#06b6d4"/>

    <!-- Candle 5 (Bullish strong) -->
    <line x1="400" y1="80" x2="400" y2="230" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="386" y="95" width="28" height="90" rx="4" fill="#10b981"/>
  </g>

  <!-- Terminal Window Chrome -->
  <rect x="64" y="80" width="384" height="352" rx="24" fill="#030712" fill-opacity="0.88" stroke="#1e293b" stroke-width="3" filter="url(#subtleGlow)"/>
  
  <!-- Window Header -->
  <path d="M 64 104 Q 64 80 88 80 L 424 80 Q 448 80 448 104 L 448 136 L 64 136 Z" fill="#0f172a"/>
  <line x1="64" y1="136" x2="448" y2="136" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Window Control Dots -->
  <circle cx="96" cy="108" r="7" fill="#ef4444"/>
  <circle cx="120" cy="108" r="7" fill="#f59e0b"/>
  <circle cx="144" cy="108" r="7" fill="#10b981"/>
  <text x="256" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">BOT TERMINAL</text>

  <!-- Terminal Prompt Line 1: '>_ ALGO' -->
  <g filter="url(#neonGlow)">
    <!-- Chevron '>' -->
    <path d="M 104 180 L 150 216 L 104 252" fill="none" stroke="url(#promptGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor '_' -->
    <line x1="175" y1="246" x2="230" y2="246" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Terminal Output Code Lines -->
  <g opacity="0.9">
    <!-- Log Line 1: Status -->
    <circle cx="108" cy="296" r="5" fill="#10b981"/>
    <rect x="124" y="290" width="130" height="12" rx="6" fill="#10b981" opacity="0.9"/>
    <rect x="264" y="290" width="90" height="12" rx="6" fill="#38bdf8" opacity="0.7"/>

    <!-- Log Line 2: Signal Alert -->
    <circle cx="108" cy="336" r="5" fill="#f43f5e"/>
    <rect x="124" y="330" width="180" height="12" rx="6" fill="#f43f5e" opacity="0.9"/>
    <rect x="314" y="330" width="80" height="12" rx="6" fill="#64748b" opacity="0.5"/>

    <!-- Log Line 3: System Heartbeat -->
    <circle cx="108" cy="376" r="5" fill="#38bdf8"/>
    <rect x="124" y="370" width="90" height="12" rx="6" fill="#38bdf8" opacity="0.8"/>
    <rect x="224" y="370" width="160" height="12" rx="6" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- Live Pulse Dot in bottom corner -->
  <circle cx="414" cy="396" r="6" fill="#10b981" filter="url(#neonGlow)"/>
</svg>
